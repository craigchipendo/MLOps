name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + end-to-end tests
        run: pytest
      - name: Pipeline smoke test (data validation + legacy baseline + 1-epoch training)
        run: |
          newsclf validate
          newsclf baseline
          newsclf train -e E3 --epochs 1 --no-mlflow

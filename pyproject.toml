[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsclf"
version = "1.0.0"
description = "News topic classifier: an end-to-end ML lifecycle and MLOps project (data-centric iteration, experiment tracking, TF Serving, canary releases, monitoring)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Craig Tanaka Chipendo" }]
license = { text = "MIT" }
dependencies = [
    "tensorflow>=2.16,<2.21",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mlflow>=2.12",
]

[project.optional-dependencies]
augment = ["nltk>=3.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "pre-commit>=3.6", "nbformat>=5.9", "nbconvert>=7.16", "ipykernel>=6.29"]

[project.scripts]
newsclf = "newsclf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains a small model end to end"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]
